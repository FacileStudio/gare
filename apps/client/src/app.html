<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<script>try{var t=localStorage.getItem('gare-theme');if(t==='dark'||t==='light')document.documentElement.classList.add(t)}catch(e){}</script>
		<title>Gare</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="description" content="Push to git: Gare builds the app, puts it live and rolls back to the last version if it breaks." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Facile" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://garev2.facile.studio/" />
		<meta property="og:title" content="Gare · Deploy from git to your own server." />
		<meta property="og:description" content="Push to git: Gare builds the app, puts it live and rolls back to the last version if it breaks." />
		<meta property="og:image" content="https://garev2.facile.studio/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Gare: Deploy from git to your own server." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Gare · Deploy from git to your own server." />
		<meta name="twitter:description" content="Push to git: Gare builds the app, puts it live and rolls back to the last version if it breaks." />
		<meta name="twitter:image" content="https://garev2.facile.studio/og-image.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
