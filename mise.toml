monorepo_root = true

[settings]
experimental = true

[monorepo]
config_roots = ["apps/api"]

[tools]
go = "1.26.11"

[tasks.build]
description = "Compile the gare binary at bin/gare"
depends = ["//apps/api:build"]
run = "true"

[tasks.test]
description = "Run all tests"
depends = ["//apps/api:test"]
run = "true"

[tasks.all]
description = "Build and run tests"
depends = ["build", "test"]
run = "true"

[tasks.lint]
description = "Run code analysis"
depends = ["//apps/api:lint"]
run = "true"

[tasks.check]
description = "Run the full quality gate: gofmt, vet, tests, the client when present, then filet"
run = "sh ./scripts/check.sh"

[tasks.format]
description = "Format the Go sources in place"
run = "sh ./scripts/check.sh --format"

[tasks.dev]
description = "Run the application"
depends = ["//apps/api:dev"]
run = "true"

[tasks.db-up]
description = "Start the daemon's development Postgres on 127.0.0.1:5439"
env = { POSTGRES_PASSWORD = "{{ get_env(name='POSTGRES_PASSWORD', default='gare-dev') }}" }
run = "podman compose -p gare-system -f deploy/compose.yml up -d"

[tasks.db-down]
description = "Stop the daemon's development Postgres, keeping its volume"
env = { POSTGRES_PASSWORD = "{{ get_env(name='POSTGRES_PASSWORD', default='gare-dev') }}" }
run = "podman compose -p gare-system -f deploy/compose.yml down"

[tasks.help]
description = "List available tasks"
run = "mise tasks --all"
