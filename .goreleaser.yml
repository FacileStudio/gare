version: 2

project_name: gare

before:
  hooks:
    - sh -c "cd apps/api && go mod tidy"
    - sh -c "cd apps/client && bun install --frozen-lockfile && bun run build"

builds:
  - id: gare
    dir: apps/api
    main: .
    binary: gare
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - src: apps/client/build/**
        dst: client

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
