name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    env:
      GARE_REQUIRE_PODMAN: "1"
      GARE_TEST_DATABASE_URL: postgres://gare:gare@127.0.0.1:5432/gare?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gare
          POSTGRES_PASSWORD: gare
          POSTGRES_DB: gare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gare"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: check podman
        run: |
          podman --version
          podman kube play --service-container=true --service-exit-code-propagation=any --help
      - name: test
        working-directory: apps/api
        run: go test -v -race ./...
