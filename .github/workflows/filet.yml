name: filet

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  filet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: GOBIN=/usr/local/bin go install golang.org/x/tools/gopls@latest
      - uses: FacileStudio/filet@v0.16.0
        with:
          fail-on: info
          antenne-url: ${{ secrets.ANTENNE_FILET_SECRET != '' && 'https://antenne.facile.studio/webhook/filet' || '' }}
          antenne-secret: ${{ secrets.ANTENNE_FILET_SECRET }}
